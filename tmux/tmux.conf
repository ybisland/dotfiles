# Author          :     YinBin
# Date            :     12 May 2022
# Encoding        :     UTF-8
# Key Bindings    :    
#    prefix             C-s
#    prefix + v         vertical split window
#    prefix + s         horizontal split window
#    prefix + r         reload config file
#    prefix + S         save tmux(resurrect)
#    prefix + R         restore tmux(resurrect)
#    prefix + C-o       rotate panes
#    prefix + l         last window 

# copy mode : 
#    prefix + [ 			  enter copy mode
#    prefix + b         list paste buffers
#    prefix + p         paste from the top paste buffer
#    prefix + P         choose which buffer to paste from
#		 y								  copy to buffer
# 	 A 									append to buffer
#    q                  quit copy mode
#    v                  visual mode

#  default key bindings :
#    prefix + x         kill - pane
#    prefix + C-z       suspend current client
#    prefix + d         detach
#    prefix + ,         rename window
#    prefix + o         next pane
#    prefix + ;         last pane
#  	 prefix + w				  select-tree
# 	 prefix + z         zoom pane


#  tpm(Tmux Plugin Manager):
#    prefix + I      Installs new plugins
#    prefix + U      updates plugins
#    prefix + A-u    remove/uninstall plugins not on the plugin list

# ====key bindings====
set -sg repeat-time 180   # repeat timeout ms
set-option -g prefix C-s  # set command prefix
unbind C-b                # unbind is the alias of unbind-key
bind C-s send-prefix      # bind is the alias of bind-key
#set-option -g prefix2 `  # second prefix (require tmux v1.6 or later)

# reload config file
bind r source-file ~/.tmux.conf \; display-message "Reloading config file finished!"

# window
bind v split-window -hc "#{pane_current_path}"  # [-c start-directory]
bind s split-window -vc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r j previous-window
bind -r k next-window

# panel :                -r : keys can be depressed repeated
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R
bind -r C-Up    resize-pane -U 2
bind -r C-Down  resize-pane -D 2
bind -r C-Right resize-pane -R 2
bind -r C-Left  resize-pane -L 2
bind Up swap-pane -U       # swap with previous pane
bind Down swap-pane -D     # swap with nexp pane

# buffer of copy
bind b list-buffers   # list paste buffers
bind p paste-buffer   # paste from the top paste buffer    # ! this doesn't work
bind P choose-buffer  # choose which buffer to paste from

# copy mode
setw -g mode-keys vi          
#bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel  # -X send a command to copy mode
bind -T copy-mode-vi y send-keys -X copy-selection  # -X send a command to copy mode
bind -T copy-mode-vi v send-keys -X begin-selection

# ====Options====
set -g base-index 1             # The index of window starts from 1
set -g pane-base-index 1        # The index of pane starts from 1
setw -g automatic-rename on     # Rename window to reflect current program
set -g renumber-windows on      # Renumber windows when a window closed
set -g set-titles on            # Set terminal title
set -g display-panes-time 800   # Slightly longer pane indicators display time
set -g display-time 1000        # Slightly longer status messages display time
set -g escape-time 0            # Faster the response when <ESC> was pressed
set -g mouse on                 # Mouse support: select text or panel; resize panel
set -g buffer-limit 30

set-window-option -g automatic-rename on
set-option -g set-titles on
set -g history-limit 5000
set -q -g status-utf8 on        # Expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g monitor-activity on      # Notification in status line when inactive window updates
set -g visual-activity off

set -g display-time 4000        # tmux messages are displayed for 4 seconds
set -g status-keys emacs

set -g focus-events on
setw -g aggressive-resize on
#set -g default-terminal "screen-256color"    # color of terminal(and all apps running in terminal) in tmux, env variables $TERM indicate current terminal color
# set -g default-terminal "xterm-256color"    # if the color of vim running in tmux differs from not running in tmux, check out $TERM
set -g default-terminal ${TERM}
# set -g default-terminal "xterm-kitty"
set-option -ga terminal-overrides ",*256col*:Tc" # support 24-bit ture color
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0


# ====Plugins====
# Installs plugins from GitHub or any other git repo: set -g @plugin 'git@bitbucket.com:user/plugin#branch'
# Changing the settings of some plugins(eg. theme, prefix-highlight) requires restarting tmux. Make sure you kill all tmux processes.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# ====Plugins settings====
set -g @resurrect-save 'S'                           # prefix + S save session
set -g @resurrect-restore 'R'                        # prefix + R restore session
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'                      # 'on' will restore session whenever you create a new tmux session
set -g @continuum-save-interval '15'                 # back up every xx minutes by default

# ====Theme setup=====  see more in ~/.tmux/plugins/tmux-themepack/basic.tmuxtheme
#set -g @themepack 'powerline/double/cyan'
set -g @themepack 'basic' 
set -goq @theme-status-left-suffix " #{prefix_highlight}"
#set -goq @theme-status-right-prefix " #{prefix_highlight}"
set -goq @themepack-status-left-area-left-format "#H"
set -goq @themepack-status-right-area-left-format "#S"
set -goq @themepack-status-right-area-middle-format "%H:%M"
set -goq @themepack-status-right-area-right-format "%d-%b"
set -g @prefix_highlight_show_copy_mode 'on'         # highlight prefix and copy mode
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold' 
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green' 
set -g @prefix_highlight_empty_prompt '   '          # empty prompt when prefix is off
set -g @prefix_highlight_prefix_prompt '⌨'           # U+2328

